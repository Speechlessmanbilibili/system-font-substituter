<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Apple UI Mix 简化版验证</title>
<style>
/* ======== 简化版: 变量字体全权重, 每区一段 ======== */
@font-face {
  font-family: "Apple UI Mix";
  src: local("SF Pro");
  font-weight: 100 900;
  unicode-range: U+0020-00B6,U+00B8-024F,U+0250-02AF,U+0370-03FF,U+0400-04FF,U+1E00-1EFF,U+2070-209F,U+20A0-20BF,U+E000-F8FF;
}
@font-face {
  font-family: "Apple UI Mix";
  src: local("PingFang UI SC");
  font-weight: 100 900;
  unicode-range: U+00B7,U+2010-2016,U+2018-2019,U+201C-201D,U+2020-2027,U+203B,U+2103,U+2160-217F,U+2460-24FF,U+2208,U+2229-222A,U+2266-2267,U+226E-226F,U+22EF,U+2E80-2FFF,U+3000-303F,U+3300-33FF,U+3400-4DBF,U+4E00-9FFF,U+F900-FAFF,U+FF00-FFEF;
}
body {
  font-family: "Apple UI Mix", "Microsoft YaHei";
  font-variation-settings: normal !important;
  text-autospace: normal !important;
  background: #fff; color: #111; padding: 20px; font-size: 30px;
}
.w100 { font-weight: 100 } .w200 { font-weight: 200 } .w300 { font-weight: 300 }
.w400 { font-weight: 400 } .w500 { font-weight: 500 } .w600 { font-weight: 600 }
.w700 { font-weight: 700 } .w800 { font-weight: 800 } .w900 { font-weight: 900 }
div { margin: 4px 0 }
</style>
</head>
<body>
<div class="w100">苹果测试 Apple 100</div>
<div class="w200">苹果测试 Apple 200</div>
<div class="w300">苹果测试 Apple 300</div>
<div class="w400">苹果测试 Apple 400</div>
<div class="w500">苹果测试 Apple 500</div>
<div class="w600">苹果测试 Apple 600</div>
<div class="w700">苹果测试 Apple 700</div>
<div class="w800">苹果测试 Apple 800</div>
<div class="w900">苹果测试 Apple 900</div>
<div style="margin-top:16px">特殊字符：弯引号“ ” 全角冒号： 带圈①②③ 框线─│ 假名あ 苹果标 省略⋯ 度°</div>
</body>
</html>
